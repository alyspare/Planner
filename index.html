:root{--sky:#1D6990;--sky2:#185B7E;--slate:#3E5877;--slate2:#2F4560;--light:#5BB8EE;--pale:#E4F2FB;--card:#FFFDF8;--ink:#1B2B38;--muted:#5A6B79;--line:#D6E5EE;--on:#D6EEFA;--gold:#F4D58D;--moon:#F7E3A8;--warn:#9C2F22;--ok:#2B6A33;--navh:62px}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--sky);color:#fff;font:500 15px/1.5 "DM Sans",system-ui,sans-serif;min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--on)}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--light);outline-offset:2px}
/* sky */
#app{position:relative;overflow:hidden;min-height:100vh}
.sky{position:absolute;inset:0;pointer-events:none;z-index:0}
.cl{position:absolute;height:auto;pointer-events:none;user-select:none;-webkit-user-drag:none}
.st{position:absolute;width:4px;height:4px;border-radius:50%;background:#FFF2A8;box-shadow:0 0 8px 3px rgba(255,214,90,.75);animation:tw 3.6s ease-in-out infinite;pointer-events:none}
.st.b{width:5px;height:5px;box-shadow:0 0 14px 5px rgba(255,214,90,.8);animation-delay:1.2s}
.sp{position:absolute;filter:drop-shadow(0 0 7px rgba(255,220,110,.95));animation:tw 4.4s ease-in-out infinite;pointer-events:none}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.st,.sp{animation:none}}
/* nav */
#nav{position:sticky;top:0;z-index:20;background:var(--sky2);border-bottom:1px solid rgba(207,234,248,.22);padding:10px max(20px,env(safe-area-inset-right)) 10px max(20px,env(safe-area-inset-left))}
.nav-in{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:9px;color:#fff;text-decoration:none;font-weight:700;font-size:17px;white-space:nowrap;background:none;border:0;padding:4px 0;cursor:pointer}
.brand svg{filter:drop-shadow(0 0 6px rgba(255,226,150,.8))}
.pages{display:flex;gap:2px;flex:1;flex-wrap:wrap}
.pages a{padding:8px 12px;border-radius:999px;color:var(--on);text-decoration:none;font-weight:600;font-size:13.5px;white-space:nowrap}
.pages a:hover{background:rgba(255,255,255,.1)}
.pages a[aria-current=page]{background:#fff;color:#174E6C;font-weight:700}
.sync{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:12.5px;color:var(--on);background:none;border:0;cursor:pointer;padding:6px 4px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:#8FD9A8;box-shadow:0 0 8px #8FD9A8}
.sync.sy-busy i,.sync.sy-pending i{background:#F7D9A6;box-shadow:0 0 8px #F7D9A6}.sync.sy-offline i{background:#B9C6CF;box-shadow:none}.sync.sy-error i{background:#FF8A7A;box-shadow:0 0 8px #FF8A7A}.sync.sy-local i{background:#B9C6CF;box-shadow:none}
.pl-link{padding:8px 12px;border-radius:10px;border:1px solid rgba(207,234,248,.45);color:#fff;text-decoration:none;font-weight:600;font-size:13px;white-space:nowrap}
.menu-btn{display:none;width:44px;height:44px;border-radius:12px;border:1px solid rgba(207,234,248,.4);background:rgba(255,255,255,.1);place-items:center;cursor:pointer;margin-left:auto}
.menu{display:none;position:absolute;right:16px;top:calc(100% + 6px);width:min(300px,calc(100vw - 32px));background:var(--card);color:var(--ink);border-radius:16px;box-shadow:0 18px 50px rgba(8,30,50,.35);padding:8px;z-index:30}
.menu.open{display:block}
.menu a,.menu button{display:flex;width:100%;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;border:0;background:none;text-align:left;text-decoration:none;color:var(--ink);font-weight:600;font-size:15px;cursor:pointer}
.menu a:hover,.menu button:hover{background:var(--pale)}
.menu a[aria-current=page]{background:var(--pale);color:#174E6C}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
@media (max-width:980px){.pages,.nav-in>.sync,.nav-in>.pl-link{display:none}.menu-btn{display:grid}}
/* page */
#main{position:relative;z-index:1}
.wrap{max-width:1160px;margin:0 auto;padding:0 32px}
.head{position:relative;padding:56px 0 140px}
.head .hin{position:relative}
.eyebrow{margin:0 0 10px;font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--on)}
h1{margin:0;font-weight:700;font-size:62px;line-height:1.05;letter-spacing:-.03em;color:#fff}
h1 .hl{font:italic 400 1.2em "Instrument Serif",serif;letter-spacing:0;padding:0 10px;background:linear-gradient(transparent 58%,rgba(91,184,238,.6) 58%)}
.sub{margin:14px 0 0;font-size:18px;color:#E3F3FB;max-width:640px}
.pill-date{margin:18px 0 0;display:inline-flex;align-items:center;gap:10px;padding:8px 14px 8px 10px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(207,234,248,.3);font-weight:600;font-size:14px;color:#fff}
.body{position:relative;padding:0 0 230px}
.grid2{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.col-main{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:24px}
.col-side{flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:24px}
.card{position:relative;background:var(--card);color:var(--ink);border-radius:22px;padding:26px;box-shadow:0 10px 40px rgba(10,50,80,.16)}
.card.top{border-top:5px solid var(--light)}
.card.dark{background:var(--slate);color:#fff}
.card h2{margin:0;font-weight:700;font-size:24px;letter-spacing:-.02em}
.card h3{margin:0;font-weight:700;font-size:18px}
.k{margin:0;font-weight:700;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.card.dark .k{color:var(--on)}
.hint{margin:8px 0 0;font-size:13px;color:var(--muted)}
.card.dark .hint{color:var(--on)}
.muted{color:var(--muted)}
.lbl{display:block;font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.in,.ta{width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;padding:11px 14px;font-weight:500;font-size:16px;color:var(--ink)}
.ta{resize:vertical;line-height:1.55;min-height:96px}
.in:focus,.ta:focus{outline:none;border-color:var(--light);box-shadow:0 0 0 3px rgba(91,184,238,.25)}
input[type=date].in,input[type=time].in{min-height:46px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.field{margin-bottom:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid #CBDDE8;background:#fff;color:#24405A;font-weight:600;font-size:15px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--pale)}
.btn.primary{background:var(--slate);border-color:var(--slate);color:#fff;box-shadow:0 0 22px rgba(91,184,238,.5)}
.btn.primary:hover{background:var(--slate2)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13.5px;border-radius:10px}
.btn.danger{color:var(--warn);border-color:#E9C9C3}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#174E6C;font-weight:700}
.btn.ghost{background:transparent;border-color:rgba(207,234,248,.45);color:#fff}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:#fff;color:#24405A;font-weight:600;font-size:13.5px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--slate);border-color:var(--slate);color:#fff}
.chip .dot{width:9px;height:9px;border-radius:50%}
.tag{display:inline-flex;align-items:center;gap:4px;min-height:32px;padding:0 6px 0 12px;border-radius:999px;background:var(--pale);color:#24405A;font-weight:600;font-size:13px}
.tag button{width:26px;height:26px;border:0;border-radius:50%;background:none;color:#5A6B79;cursor:pointer;font-size:16px;line-height:1}
.tag-in{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag-in input{flex:1 1 120px;min-width:0;min-height:36px;border:1px dashed #BFD3DF;border-radius:999px;padding:0 12px;font-size:14px;background:#fff;color:var(--ink)}
.scale{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:5px}
.scale button{height:40px;border:1px solid var(--line);border-radius:10px;background:#fff;color:#24405A;font-weight:700;font-size:14px;cursor:pointer;padding:0}
.scale button.in{background:#DDEFF9}
.scale button[aria-pressed=true]{background:var(--slate);border-color:var(--slate);color:#fff}
.ends{display:flex;justify-content:space-between;margin-top:6px;font-size:12.5px;color:var(--muted)}
.ends b{color:var(--ink)}
.note-ok{margin:14px 0 0;padding:10px 14px;border-radius:12px;background:#D3EDD4;color:var(--ok);font-weight:600;font-size:14px}
.empty{color:var(--muted);font-size:14px;margin:6px 0 0}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin-bottom:24px}
.tile{position:relative;background:var(--card);color:var(--ink);border-radius:20px;padding:18px 20px;box-shadow:0 10px 40px rgba(10,50,80,.16)}
.tile .v{margin:6px 0 2px;font-weight:700;font-size:32px;line-height:1.1}
.tile .d{margin:0;font-size:13px;color:var(--muted)}
.tile.gold{background:#FFF6DC}.tile.gold .k,.tile.gold .d{color:#7A5A12}
/* controls on the sky */
.ctl-row{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-top:24px}
.seg{display:inline-flex;padding:4px;border-radius:12px;background:rgba(255,255,255,.1);border:1px solid rgba(207,234,248,.3)}
.seg button{min-height:36px;padding:0 15px;border:0;border-radius:9px;background:transparent;color:#E3F3FB;font-weight:600;font-size:13.5px;cursor:pointer}
.seg button[aria-pressed=true]{background:#fff;color:#174E6C;font-weight:700}
.card .seg{background:var(--pale);border-color:var(--line)}.card .seg button{color:#24405A}.card .seg button[aria-pressed=true]{background:var(--slate);color:#fff}
.pnav{display:flex;align-items:center;gap:10px}
.pnav button{width:40px;height:40px;border-radius:10px;border:1px solid rgba(207,234,248,.35);background:rgba(255,255,255,.08);color:#fff;font-weight:700;font-size:18px;cursor:pointer}
.pnav b{font-size:17px;min-width:140px;text-align:center}
.pnav .btn{min-height:40px}
/* calendar */
.dow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-bottom:8px;font-weight:700;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{height:88px;border-radius:14px;padding:8px 9px;border:1px solid #DCE9F1;background:#fff;display:flex;flex-direction:column;justify-content:space-between;text-align:left;cursor:pointer;color:var(--ink);min-width:0}
.day.out{background:#F4F8FB;border-color:#E4EEF4;color:#9AAAB6}
.day.sel{background:#E1F1FB;border-color:var(--light)}
.day.today{border:2px solid var(--slate);box-shadow:0 0 0 4px rgba(91,184,238,.4),0 0 18px rgba(247,227,168,.55)}
.day .n{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:14px}
.day .dots{display:flex;gap:4px;align-items:center;flex-wrap:wrap;min-height:14px}
.day .tt{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--slate);margin-left:auto}
.dd{width:10px;height:10px;border-radius:50%;display:inline-block}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:16px;padding-top:14px;border-top:1px solid #DCE9F1;font-weight:600;font-size:13px;color:#43525F}
.legend span{display:inline-flex;align-items:center;gap:7px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.wday{min-height:200px;border-radius:14px;border:1px solid #DCE9F1;background:#fff;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.wday.today{border:2px solid var(--slate)}
.wday .wh{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:13px}
.mini{display:block;width:100%;text-align:left;border:0;border-radius:10px;background:var(--pale);padding:8px;cursor:pointer;color:var(--ink)}
.mini b{display:block;font-size:13px;line-height:1.3;overflow-wrap:anywhere}
.mini span{font-size:11.5px;color:var(--muted)}
.dream{border-top:1px solid #DCE9F1;padding-top:14px;margin-top:14px}
.dream:first-of-type{border-top:0;margin-top:10px;padding-top:0}
.dream h4{margin:4px 0 8px;font:italic 400 27px/1.15 "Instrument Serif",serif;color:var(--ink)}
.dream p{margin:0 0 12px;font-size:14px;line-height:1.55;color:#43525F}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:26px;padding:0 10px;border-radius:999px;background:var(--pale);color:#24405A;font-weight:700;font-size:12px}
.pill.lucid{background:#FFF1CC;color:#6B4E0E}.pill.night{background:#E6E9EF;color:#263447}
.moons{display:grid;gap:12px;font-weight:600;font-size:14px}
.moons div{display:flex;align-items:center;gap:12px}.moons span{flex:1}.moons em{font-style:normal;color:var(--muted)}
/* lists */
.list{list-style:none;margin:0;padding:0}
.list li+li{border-top:1px solid #DCE9F1}
.row-btn{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:11px 2px;border:0;background:none;text-align:left;cursor:pointer;color:var(--ink)}
.row-btn b{display:block;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-btn small{display:block;font-size:12.5px;color:var(--muted)}
.row-btn em{font-style:normal;font-size:12.5px;color:var(--muted);white-space:nowrap}
.ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--pale);flex:none}
/* week moons */
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;text-align:center;font-weight:600;font-size:11.5px;color:var(--muted)}
.wk i{display:block;margin:6px auto 0;width:26px;height:26px;border-radius:50%;background:#DDEFF9}
.wk i.on{background:var(--slate);box-shadow:0 0 10px rgba(91,184,238,.7)}
.wk i.now{background:none;border:2px dashed var(--light)}
/* bars */
.bars{display:grid;gap:9px}
.bar{display:grid;grid-template-columns:120px minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:13.5px;font-weight:600}
.bar span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .tr{height:12px;border-radius:999px;background:#E9F2F8;overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:999px;background:var(--light)}
.bar b{text-align:right;font-variant-numeric:tabular-nums}
.sum{padding:14px 16px;border-radius:14px;background:var(--pale);font-size:14.5px;line-height:1.6}
.sum p{margin:0 0 8px}.sum p:last-child{margin:0}
/* library cards */
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.lc{display:flex;flex-direction:column;gap:10px;text-align:left;border:0;cursor:pointer;width:100%}
.lc .lh{display:flex;align-items:center;gap:10px}
.lc .lh b{font-size:17px;flex:1;min-width:0;overflow-wrap:anywhere}
.lc .cnt{font-weight:700;font-size:26px}
.lc ul{list-style:none;margin:0;padding:0;display:grid;gap:5px;font-size:13px}
.lc li{display:flex;justify-content:space-between;gap:10px;border-top:1px solid #E4EEF4;padding-top:5px}
.lc li b{text-align:right}
.lc .mean{font-size:13px;color:#43525F;margin:0;font-style:italic}
/* signs */
.signs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.sg{background:var(--pale);border-radius:14px;padding:12px}
.sg h4{margin:0 0 4px;font-size:14px}
.sg p{margin:0 0 8px;font-size:12px;color:var(--muted)}
.sgi{display:flex;flex-wrap:wrap;align-items:center;gap:6px;background:#fff;border-radius:10px;padding:8px 8px 8px 10px;margin-top:6px;font-size:13.5px}
.sgi span{flex:1 1 100%;min-width:0;overflow-wrap:break-word;line-height:1.35}
.sgi b{margin-right:auto}
.sgi b{font-size:12px;color:var(--muted)}
.sgi button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;color:#24405A;font-weight:700}
.counter{display:flex;align-items:center;gap:16px}
.counter b{font-size:44px;line-height:1;min-width:60px;text-align:center}
.counter button{width:52px;height:52px;border-radius:14px;font-size:24px;font-weight:700}
/* drawer */
#scrim{position:fixed;inset:0;background:rgba(8,28,45,.5);z-index:40}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,100vw);background:var(--card);color:var(--ink);z-index:41;display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(8,28,45,.35)}
.d-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line);padding-top:max(14px,env(safe-area-inset-top))}
.d-top .x{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:20px;cursor:pointer;color:var(--ink)}
.d-scroll{flex:1;overflow:auto;padding:20px 22px calc(28px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.d-sec{margin-top:22px}
.d-sec>h3{margin:0 0 10px;font-size:15px}
.d-title{width:100%;border:0;border-bottom:2px solid var(--line);background:none;font:italic 400 30px/1.2 "Instrument Serif",serif;color:var(--ink);padding:4px 0 8px;resize:none}
.d-title:focus{outline:none;border-color:var(--light)}
.d-foot{display:flex;justify-content:space-between;gap:10px;margin-top:28px;padding-top:16px;border-top:1px solid var(--line)}
.sy-sec{border:1px solid var(--line);border-radius:14px;padding:16px;background:#fff}
.sy-sec.on{border-color:#BFDCC2;background:#F6FBF5}
.sy-badge{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:999px;background:#D3EDD4;color:var(--ok);font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.sy-status{display:flex;gap:10px;align-items:flex-start;margin:0 0 12px;font-size:13.5px}
.sy-dot{flex:none;width:10px;height:10px;border-radius:50%;margin-top:5px;background:#3FA35A}
.sy-dot.sy-busy,.sy-dot.sy-pending{background:#E3A33A}.sy-dot.sy-offline{background:#A99F92}.sy-dot.sy-error{background:#D64545}
.sy-form{display:grid;gap:12px;margin:12px 0}
.sy-form .in{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px}
.sy-show{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600}
.sy-msg:empty{display:none}.sy-bad{color:var(--warn);font-weight:600}
.steps{margin:10px 0;padding-left:20px;font-size:14px}.steps li{margin-bottom:8px}
footer{position:relative;z-index:2;text-align:center;padding:0 20px calc(28px + env(safe-area-inset-bottom));margin-top:-64px;font-size:13px;color:var(--on)}
footer .fin{display:inline-flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:2px;padding:4px 10px;border-radius:999px;background:rgba(24,91,126,.92);box-shadow:0 6px 20px rgba(8,30,50,.25)}
footer button{background:none;border:0;color:#fff;text-decoration:underline;text-underline-offset:3px;font-weight:600;cursor:pointer;padding:8px}
#notices{position:relative;z-index:2}
.notice{max-width:1160px;margin:14px auto 0;padding:12px 16px;border-radius:14px;background:var(--card);color:var(--ink);display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:14px;box-shadow:0 10px 30px rgba(10,50,80,.2)}
.notice .grow{flex:1;min-width:200px}
.cc{pointer-events:none}
@media (max-width:900px){
  .wrap{padding:0 16px}
  .head{padding:30px 0 110px}
  h1{font-size:40px}
  .sub{font-size:16px}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .signs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .card{padding:20px;border-radius:20px}
  .day{height:64px;padding:6px;border-radius:10px}
  .day .tt{display:none}
  .cal,.dow{gap:4px}
  .week{grid-template-columns:1fr}
  .wday{min-height:0}
  .body{padding-bottom:180px}
}
@media (max-width:560px){
  .row2,.row3{grid-template-columns:1fr}
  .cards{grid-template-columns:1fr}
  .scale{gap:3px}.scale button{height:38px;font-size:13px}
  .bar{grid-template-columns:96px minmax(0,1fr) 30px}
  .day{height:54px}.day .n{font-size:12.5px}.dd{width:8px;height:8px}
  .pnav b{min-width:110px;font-size:15px}
  .grid2{gap:18px}.col-main,.col-side{gap:18px}
}

/* header sky, page sky, cloud bank, clouds on card edges */

.hc-moon svg{width:100%;height:100%}
.hc-1{right:15%;top:26px;width:176px}.hc-2{right:17%;top:104px;width:190px}.hc-3{right:-34px;top:118px;width:330px}.hc-4{right:27%;top:214px;width:168px}
.hc-5{left:14px;top:8px;width:84px}.hc-6{left:53%;top:30px;width:70px}
.hb{z-index:0}.hb-1{left:-4%;bottom:-80px;width:28%}.hb-2{left:20%;bottom:-48px;width:20%}.hb-3{left:37%;bottom:-88px;width:26%}.hb-4{left:58%;bottom:-46px;width:18%}.hb-5{left:70%;bottom:-78px;width:27%}.hb-6{right:-3%;bottom:-38px;width:17%}

.bband{position:absolute;left:50%;width:100vw;transform:translateX(-50%);bottom:0;height:220px;pointer-events:none}
.bb-1{left:-4%;bottom:-70px;width:28%}.bb-2{left:21%;bottom:-40px;width:20%}.bb-3{left:39%;bottom:-80px;width:26%}.bb-4{left:60%;bottom:-38px;width:18%}.bb-5{left:71%;bottom:-70px;width:27%}.bb-6{right:-3%;bottom:-30px;width:17%}
.cc-a{right:-40px;top:-66px;width:240px}.cc-b{right:-56px;top:-56px;width:196px}.cc-c{right:-56px;top:-78px;width:168px}.cc-d{right:-52px;bottom:-60px;width:168px}
.cc-e{left:-44px;top:30%;width:70px}.cc-f{left:-126px;top:38%;width:150px}.cc-g{right:-60px;bottom:-70px;width:230px}.cc-h{right:-30px;top:-34px;width:88px}.cc-i{right:-40px;bottom:-44px;width:120px}.cc-t{left:-34px;top:-44px;width:96px}
.calc .legend{padding-right:170px}
.sky-q{display:inline-flex}
.sky-q input{min-height:44px;width:220px;max-width:100%;border-radius:12px;border:1px solid rgba(207,234,248,.35);background:rgba(255,255,255,.12);color:#fff;padding:0 14px;font-size:15px}
.sky-q input::placeholder{color:#CFEAF8}
.sky-q input:focus{outline:none;border-color:#fff;background:rgba(255,255,255,.18)}

@media (max-width:900px){
  .hc-1,.hc-2,.hc-3,.hc-4,.hc-6,.hide-m{display:none}

/* ---------- helpers ---------- */
function pad(n){ return (n < 10 ? '0' : '') + n; }
function iso(y, m, d){ return y + '-' + pad(m) + '-' + pad(d); }
function validISO(s){ return /^\d{4}-\d{2}-\d{2}$/.test(s || ''); }
function parse(s){ return {y:+s.slice(0, 4), m:+s.slice(5, 7), d:+s.slice(8, 10)}; }
function toDate(s){ var p = parse(s); return new Date(p.y, p.m - 1, p.d); }
function fromDate(d){ return iso(d.getFullYear(), d.getMonth() + 1, d.getDate()); }
function today(){ return fromDate(new Date()); }
function addDays(s, n){ var d = toDate(s); d.setDate(d.getDate() + n); return fromDate(d); }
function daysBetween(a, b){ return Math.round((toDate(b) - toDate(a)) / 864e5); }
function dim(y, m){ return new Date(y, m, 0).getDate(); }
function dowOf(s){ return toDate(s).getDay(); }
function fmtShort(s){ var p = parse(s); return MON[p.m - 1] + ' ' + p.d; }
function fmtMed(s){ var p = parse(s); return MON[p.m - 1] + ' ' + p.d + ', ' + p.y; }
function fmtDay(s){ return DOW[dowOf(s)] + ', ' + fmtShort(s); }
function fmtLong(s){ var p = parse(s); return DOWF[dowOf(s)] + ', ' + MONTHS[p.m - 1] + ' ' + p.d; }
function fmtTime(t){ if(!/^\d{2}:\d{2}/.test(t || '')) return ''; var h = +t.slice(0, 2), m = t.slice(3, 5); return ((h % 12) || 12) + (m === '00' ? '' : ':' + m) + (h < 12 ? 'am' : 'pm'); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function plural(n, w, pl){ return n + ' ' + (n === 1 ? w : (pl || w + 's')); }

var SYN = 29.530588853, REF = Date.UTC(2000, 0, 6, 18, 14) / 864e5;

function phaseName(age){
  var n = ['New moon','Waxing crescent','First quarter','Waxing gibbous','Full moon','Waning gibbous','Last quarter','Waning crescent','New moon'];
  return n[Math.floor((age / SYN) * 8 + 0.5)];
}
function phaseGroup(age){ var f = age / SYN; return f < 0.0625 || f >= 0.9375 ? 'New' : f < 0.4375 ? 'Waxing' : f < 0.5625 ? 'Full' : 'Waning'; }
function mainPhases(a, b){
  var out = [], ta = toDate(a).getTime() / 864e5, k0 = Math.floor((ta - REF - 40 * 0) / SYN) - 1;
  for(var k = k0; k < k0 + 4 + Math.ceil(daysBetween(a, b) / SYN); k++){
    [['New moon', 0], ['First quarter', .25], ['Full moon', .5], ['Last quarter', .75]].forEach(function(x){
      var ms = (REF + (k + x[1]) * SYN) * 864e5, d = fromDate(new Date(ms));
      if(d >= a && d <= b) out.push({date:d, name:x[0], age:x[1] * SYN});
    });
  }

}
function moonSVG(age, size, glow, dark){
  var f = age / SYN, k = Math.cos(2 * Math.PI * f), rx = (6.25 * Math.abs(k)).toFixed(2), d;
  if(f < 0.5) d = 'M7 .75A6.25 6.25 0 0 1 7 13.25A' + rx + ' 6.25 0 0 ' + (f < 0.25 ? 0 : 1) + ' 7 .75Z';
  else d = 'M7 .75A6.25 6.25 0 0 0 7 13.25A' + rx + ' 6.25 0 0 ' + (f > 0.75 ? 1 : 0) + ' 7 .75Z';

    '<circle cx="7" cy="7" r="6.25" fill="' + (dark || '#3E5877') + '" stroke="' + (dark ? 'rgba(247,227,168,.35)' : '#2F4560') + '" stroke-width="' + (dark ? .5 : 1.2) + '"/><path d="' + d + '" fill="#F7E3A8"/></svg>';
}

      c === 403 || c === 404 ? 'That key can’t save gists. Make a new key and keep the gist box checked.' :
      (c === 'offline' || c === 'network') && syLocalCopy() ? 'This copy of the journal is opened from a file or a preview, so it can’t go online. Open it from its web address (github.io) and turn on sync there.' :
      c === 'offline' || c === 'network' ? 'Can’t reach GitHub right now. Check your internet and try again.' :

}
